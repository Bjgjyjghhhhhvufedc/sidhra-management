<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="30%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="brightGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#eab308" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="100" fill="url(#bg)" />
  <rect x="20" y="20" width="472" height="472" rx="80" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.4" />
  
  <!-- Fabric Curves -->
  <path d="M 180 160 C 120 190, 120 260, 180 280 C 230 295, 240 320, 200 340" fill="none" stroke="url(#brightGold)" stroke-width="12" stroke-linecap="round" filter="url(#goldGlow)"/>
  
  <!-- Tailoring Needle -->
  <g transform="rotate(25, 256, 220)">
    <path d="M 256 80 L 262 280 L 256 330 L 250 280 Z" fill="url(#gold)" />
    <ellipse cx="256" cy="110" rx="3" ry="12" fill="#0f172a" />
  </g>
  
  <!-- Golden Thread -->
  <path d="M 170 110 C 220 80, 252 105, 254 110 C 260 120, 320 160, 310 230 C 300 290, 230 290, 270 340" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" />
  
  <text x="256" y="415" font-family="system-ui, sans-serif" font-size="32" font-weight="800" letter-spacing="8" fill="#ffffff" text-anchor="middle">SIDHRA</text>
  <text x="256" y="445" font-family="system-ui, sans-serif" font-size="16" font-weight="600" letter-spacing="8" fill="#94a3b8" text-anchor="middle">GARMENTS</text>
</svg>