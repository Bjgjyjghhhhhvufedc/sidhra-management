<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIDHRA GARMENTS - Workshop System</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/svg+xml" href="icon-192.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-md mx-auto p-4 sm:p-6">
    <header class="text-center my-8">
      <div class="w-20 h-20 bg-gradient-to-tr from-amber-500 to-amber-300 rounded-3xl mx-auto flex items-center justify-center text-slate-950 font-extrabold text-3xl shadow-xl shadow-amber-500/20 mb-4">SG</div>
      <h1 class="text-2xl font-bold text-white tracking-wide">SIDHRA GARMENTS</h1>
      <p class="text-amber-400 text-xs tracking-widest font-semibold uppercase mt-1">Workshop Management System</p>
    </header>
    
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl text-center space-y-4">
      <div class="w-12 h-12 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-xl">
        <i class="fa-solid fa-check"></i>
      </div>
      <h2 class="text-lg font-bold text-white">System Ready & Installed</h2>
      <p class="text-slate-400 text-sm">PWA Service Worker & Manifest registered successfully.</p>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW Registered:', reg))
          .catch(err => console.error('SW Fail:', err));
      });
    }
  </script>
</body>
</html>
